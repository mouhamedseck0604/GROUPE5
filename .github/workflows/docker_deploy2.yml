name: CI/CD Docker Deploy with SCP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer ton code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # 2. Copier les fichiers vers le serveur distant
      - name: Copy project to EC2 (SCP)
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "mkdir -p /home/$EC2_USER/DOCKER_G5"
          scp -i ~/.ssh/id_rsa -r ./ $EC2_USER@$EC2_HOST:/home/$EC2_USER/DOCKER_G5
          
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      # 3. Construire et lancer le conteneur sur le serveur
      - name: Install dependencies and run app
        run: |
          ssh $EC2_USER@$EC2_HOST << EOF
          cd /home/${{ secrets.EC2_USER }}/DOCKER_G5
          docker stop flask_app1 || true
          docker rm flask_app1 || true
          docker build -t flask_app1 .
          docker run -d -p 5005:5005 flask_app1
          EOF
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
      
            
